<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apple Centre</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #fafafa; color: #0b0b0f;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1.75rem; color: #5b5b66; line-height: 1.55; }
      button {
        font: inherit; font-weight: 600; cursor: pointer;
        padding: .75rem 1.5rem; border: 0; border-radius: .6rem;
        background: #0b0b0f; color: #fff;
      }
      button:hover { background: #26262e; }
      button:focus-visible { outline: 2px solid #6e56f8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can&rsquo;t reach the Apple Centre</h1>
      <p>Check your internet connection, then try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      document.getElementById('retry').addEventListener('click', () => {
        location.href = params.get('retry') || 'https://apple-centre-rit.vercel.app'
      })
    </script>
  </body>
</html>
